name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      carplay:
        description: "Include the CarPlay entitlement (only after Apple granted it)"
        type: boolean
        default: false

jobs:
  build-test-screenshot:
    # Manual runs are for TestFlight; pushes and PRs run the tests.
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BUNDLE_ID: com.nomanwhos.torpido
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(p) for p in runtime.split("iOS-")[1].split("-"))
          runtimes = sorted((r for r in devices if "iOS-" in r and version(r) >= (18,)), key=version)
          phones = [d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using $UDID"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Torpido.xcodeproj -scheme Torpido \
            -destination "id=$UDID" -derivedDataPath build \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            > xcodebuild.log 2>&1 || {
              python3 scripts/ci_annotate.py xcodebuild.log
              exit 1
            }
            grep -E "Test Case .* (passed|failed)|\*\* TEST" xcodebuild.log

      - name: Capture screenshots
        run: |
          mkdir -p .impeccable/review
          APP=$(find build/Build/Products -name Torpido.app -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4
          xcrun simctl install "$UDID" "$APP"
          shot() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "${@:2}"
            sleep "${SHOT_WAIT:-4}"
            xcrun simctl io "$UDID" screenshot ".impeccable/review/$1.png"
          }
          shot home-empty
          shot phone-waiting -TorpidoTab perde
          shot phone-ready -TorpidoTab perde -TorpidoStage ready
          shot phone-live -TorpidoTab perde -TorpidoStage live
          shot design-catalog -TorpidoCatalog 1
          shot home -TorpidoSeed 1
          shot favorites -TorpidoTab favorites
          shot phone-settings -TorpidoTab settings
          SHOT_WAIT=10 shot player -TorpidoPlay 1
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          shot phone-live-large-type -TorpidoTab perde -TorpidoStage live
          shot home-large-type

      - name: Publish screenshots to the review-shots branch
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .impeccable/review
          git init -q
          git checkout -q -b review-shots
          git add ./*.png
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" review-shots

      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torpido-review
          path: |
            .impeccable/review
            xcodebuild.log

  testflight:
    # Actions > iOS > Run workflow. Needs repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
    # (an App Store Connect API key with the App Manager role). Signing is automatic.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key secrets exist
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is missing"; exit 1; fi
          done

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (signed, automatic provisioning)
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          ENTITLEMENTS=()
          if [ "${{ inputs.carplay }}" != "true" ]; then
            ENTITLEMENTS=(CODE_SIGN_ENTITLEMENTS=App/Torpido-NoCarPlay.entitlements)
          fi
          xcodebuild archive \
            -project Torpido.xcodeproj -scheme Torpido -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Torpido.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${ENTITLEMENTS[@]}" \
            > archive.log 2>&1 || { python3 scripts/ci_annotate.py archive.log; exit 1; }

      - name: Upload to TestFlight
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Torpido.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1 || { python3 scripts/ci_annotate.py export.log; exit 1; }
          rm -f "$KEY"
