# Generates Torpido.xcodeproj on a Mac or CI runner: `xcodegen generate`.
# Set BUNDLE_ID_PREFIX and DEVELOPMENT_TEAM to your own Apple Developer values before a device build.
name: Torpido
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Torpido:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Single source of the database schema, bundled as schema.sql.
      - path: replica/schema.sql
        buildPhase: resources
    dependencies:
      - target: TorpidoBroadcast
      - package: GRDB
    entitlements:
      path: App/Torpido.entitlements
      properties:
        # Must be granted to your team by Apple: developer.apple.com/carplay
        com.apple.developer.carplay-maps: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Torpido
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Night
        # Most IPTV streams and playlists are plain http. Personal build, not for the App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Keeps sound playing from the mini player with the screen locked.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).torpido
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TorpidoBroadcast:
    type: app-extension
    platform: iOS
    sources: [BroadcastExtension, Shared]
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: Torpido
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).torpido.broadcast

  TorpidoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Torpido
      # Already linked into the host app; only the module is needed here.
      - package: GRDB
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).torpido.tests

  TorpidoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Torpido
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).torpido.uitests
        TEST_TARGET_NAME: Torpido

schemes:
  Torpido:
    build:
      targets:
        Torpido: all
    test:
      targets: [TorpidoTests, TorpidoUITests]
